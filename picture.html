<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangaPanel – Manga Mint</title>
  <link rel="stylesheet" href="picturestylesheet.css">
</head>
<body>

  <header class="header">
    <a href="#" class="logo">
      <img src="banner.png" alt="Sketch Up Logo"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
      <span class="logo-text" style="display:none;">MANGA MINT</span>
    </a>

    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="start.html">Starting</a>
      <a href="video.html">Videos</a>
      <a href="picture.html">Pictures</a>
    </nav>
  </header>

  <div class="banner">
    <div class="slider-wrapper">
      <input type="radio" name="slider" id="slide1" checked>
      <input type="radio" name="slider" id="slide2">
      <input type="radio" name="slider" id="slide3">

      <div class="slider-container">
        <label for="slide1" class="slide" id="img1"><img src="aot.jpg" alt="AOT"></label>
        <label for="slide2" class="slide" id="img2"><img src="bluelock.jpg" alt="Blue Lock"></label>
        <label for="slide3" class="slide" id="img3"><img src="Itadori Yuji.jpg" alt="JJK"></label>
      </div>
    </div>

    <div class="content">
      <div class="author">
        <h2>MANGA MINT</h2>
        <p><b>anime sketching</b></p>
        <p>Learn Anime Sketching From Zero To Advance For Free!!</p>
      </div>
      <div class="model" role="presentation" aria-hidden="true"></div>
    </div>
  </div>

</body>
</html>
